    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const filesDataScript = document.getElementById('filesData');
            const filesData = JSON.parse(filesDataScript.textContent);
            const files = filesData.files;
            
            // Organize files by category
            const primaryFiles = files;
            // const variantFiles = files.filter(f => f.category === 'variant');
            // const bonusFiles = files.filter(f => f.category === 'bonus');
            
            // Render functions
            function renderCard(file) {
                const borderClass = file.category === 'variant' ? 'border-l-emerald-500' : 
                                   file.category === 'bonus' ? 'border-l-amber-500' : 'border-l-blue-500';
                const badgeClass = file.category === 'variant' ? 'bg-emerald-100 text-emerald-700' : 
                                  file.category === 'bonus' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-600';
                const badgeText = file.category === 'variant' ? 'Design Variant' : 
                                 file.category === 'bonus' ? 'Bonus' : 'Primary';
                
                return `
                    <a href="${file.path}" class="bg-white rounded-lg p-6 shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all border-l-4 ${borderClass} no-underline text-inherit flex flex-col" title="${file.description}">
                        <div class="text-5xl mb-4">${file.icon}</div>
                        <div class="text-xl font-bold text-gray-800 mb-2">${file.name}</div>
                        <div class="text-sm text-gray-600 mb-4 flex-grow">${file.description}</div>
                        <div class="text-xs text-gray-500 font-mono bg-gray-100 p-2 rounded overflow-x-auto">${file.path}</div>
                        <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold mt-3 w-fit ${badgeClass}">${badgeText}</span>
                    </a>
                `;
            }
            
            function renderGrid(files, gridId) {
                const grid = document.getElementById(gridId);
                grid.innerHTML = files.map(renderCard).join('');
            }
            
            // Initial render
            renderGrid(primaryFiles, 'primaryGrid');
           
            // Search functionality
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                let hasResults = false;
                
                // Filter primary
                const filteredPrimary = primaryFiles.filter(f => 
                    f.name.toLowerCase().includes(query) || 
                    f.description.toLowerCase().includes(query)
                );
                const primarySection = document.getElementById('primarySection');
                if (filteredPrimary.length > 0) {
                    renderGrid(filteredPrimary, 'primaryGrid');
                    primarySection.style.display = 'block';
                    hasResults = true;
                } else {
                    primarySection.style.display = 'none';
                }
                
              
                
                // Show/hide no results message
                document.getElementById('noResults').style.display = hasResults ? 'none' : 'block';
            });
        });
